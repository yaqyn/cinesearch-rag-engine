[project]
name = "cinesearch-rag-engine"
version = "0.1.0"
description = "A movie search engine combining BM25, semantic retrieval, hybrid ranking, and grounded generation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nltk>=3.10.3",
    "numpy==2.3.3",
    "openai==2.44.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=6.1.0",
    "torch",
]

[project.scripts]
cinesearch = "cli.cinesearch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
